\\"\\nDISPLAY[\\\"X\\\"] = \\\"\u5927\u738b\\\"\\n\\nMAX_STRAIGHT_RANK = 14  # \u987a\u5b50\/\u8fde\u5bf9\/\u98de\u673a\u6700\u9ad8\u5230\\\n          \\ A\uff0c\u4e0d\u542b 2 \u548c\u738b\\n\\n\\nclass IllegalMove(Exception):\\n    \\\"\\\"\\\"\u975e\u6cd5\u51fa\u724c\u3002\\\"\\\"\\\"\\n\\n\\\n          \\n# ---------------------------------------------------------------- \u57fa\u7840\u5de5\u5177\\n\\\n          \\n\\ndef sort_cards(cards):\\n    return sorted(cards, key=lambda c: (VALUE[c],\\\n          \\ c))\\n\\n\\ndef pretty(cards):\\n    if not cards:\\n        return \\\"\uff08\u65e0\uff09\\\"\\\n          \\n    return \\\" \\\".join(DISPLAY[c] for c in sort_cards(cards))\\n\\n\\ndef\\\n          \\ parse_cards(text, hand):\\n    \\\"\\\"\\\"\u628a\u73a9\u5bb6\u8f93\u5165\u89e3\u6790\u6210\u624b\u724c\u5b50\u96c6\uff1b\u65e0\u6cd5\u89e3\u6790\u65f6\u629b IllegalMove\u3002\\n\\\n          \\n    \u5bb9\u5fcd\u7a7a\u683c\u3001\u9017\u53f7\u3001\u4e2d\u6587\u9017\u53f7\uff1b\\\"10\\\" \u81ea\u52a8\u6298\u7b97\u6210 \\\"T\\\"\u3002\\n    \\\"\\\"\\\"\\n    raw = (text or \\\"\\\n          \\\").strip()\\n    if not raw:\\n        raise IllegalMove(\\\"\u6ca1\u6709\u8f93\u5165\u724c\\\")\\n   \\\n          \\ raw = raw.replace(\\\"\uff0c\\\", \\\",\\\").replace(\\\"\u3001\\\", \\\",\\\").replace(\\\" \\\", \\\"\\\n          \\\").replace(\\\",\\\", \\\"\\\")\\n    raw = raw.replace(\\\"10\\\", \\\"T\\\")\\n    cards\\\n          \\ = []\\n    for ch in raw:\\n        if ch not in VALUE:\\n            raise\\\n          \\ IllegalMove(\\\"\u770b\u4e0d\u61c2\u8fd9\u5f20\u724c\uff1a%s\\\" % ch)\\n        cards.append(ch)\\n    # \u9010\u5f20\u6838\u5bf9\uff0c\u9632\u6b62\u8f93\u5165\u6bd4\u624b\u724c\u8fd8\u591a\\n\\\n          \\    pool = list(hand)\\n    for c in cards:\\n        if c not in pool:\\n\\\n          \\            raise IllegalMove(\\\"\u624b\u91cc\u6ca1\u6709\u8fd9\u5f20\u724c\uff1a%s\\\" % DISPLAY[c])\\n        pool.remove(c)\\n\\\n          \\    return sort_cards(cards)\\n\\n\\n# ----------------------------------------------------------------\\\n          \\ \u724c\u578b\u5224\u5b9a\\n\\n\\ndef _is_run(ranks, length):\\n    if len(ranks) != length or\\\n          \\ not ranks:\\n        return False\\n    if ranks[-1] > MAX_STRAIGHT_RANK:\\n\\\n          \\        return False\\n    return ranks == list(range(ranks[0], ranks[0]\\\n          \\ + length))\\n\\n\\ndef classify(cards):\\n    \\\"\\\"\\\"\u8fd4\u56de {'type': \u724c\u578b, 'n': \u5f20\u6570,\\\n          \\ 'rank': \u6bd4\u8f83\u7528\u4e3b\u724c\u503c}\uff0c\u975e\u6cd5\u8fd4\u56de None\u3002\\\"\\\"\\\"\\n    return _classify_cached(tuple(cards))\\n\\\n          \\n\\n@lru_cache(maxsize=8192)\\ndef _classify_cached(cards):\\n    if not cards:\\n\\\n          \\        return None\\n    try:\\n        vals = [VALUE[c] for c in cards]\\n\\\n          \\    except KeyError:\\n        return None\\n    n = len(vals)\\n    cnt =\\\n          \\ Counter(vals)\\n    keys = sorted(cnt)\\n\\n    if n == 2 and set(vals) ==\\\n          \\ {16, 17}:\\n        return {\\\"type\\\": \\\"rocket\\\", \\\"n\\\": 2, \\\"rank\\\": 17}\\n\\\n          \\    if n == 4 and len(cnt) == 1:\\n        return {\\\"type\\\": \\\"bomb\\\", \\\"\\\n          n\\\": 4, \\\"rank\\\": keys[0]}\\n    if n == 1:\\n        return {\\\"type\\\": \\\"\\\n          single\\\", \\\"n\\\": 1, \\\"rank\\\": keys[0]}\\n    if n == 2 and len(cnt) == 1:\\n\\\n          \\        return {\\\"type\\\": \\\"pair\\\", \\\"n\\\": 2, \\\"rank\\\": keys[0]}\\n    if\\\n          \\ n == 3 and len(cnt) == 1:\\n        return {\\\"type\\\": \\\"trio\\\", \\\"n\\\":\\\n          \\ 3, \\\"rank\\\": keys[0]}\\n\\n    if n >= 5 and n <= 12 and all(c == 1 for\\\n          \\ c in cnt.values()) and _is_run(keys, n):\\n        return {\\\"type\\\": \\\"\\\n          straight\\\", \\\"n\\\": n, \\\"rank\\\": keys[-1]}\\n    if n >= 6 and n % 2 == 0\\\n          \\ and all(c == 2 for c in cnt.values()) and _is_run(keys, n \/\/ 2):\\n   \\\n          \\     return {\\\"type\\\": \\\"double_straight\\\", \\\"n\\\": n, \\\"rank\\\": keys[-1]}\\n\\\n          \\    if n >= 6 and n % 3 == 0 and all(c == 3 for c in cnt.values()) and\\\n          \\ _is_run(keys, n \/\/ 3):\\n        return {\\\"type\\\": \\\"airplane\\\", \\\"n\\\"\\\n          : n, \\\"rank\\\": keys[-1]}\\n\\n    if n == 4:\\n        for r, c in cnt.items():\\n\\\n          \\            if c == 3:\\n                return {\\\"type\\\": \\\"trio_single\\\"\\\n          , \\\"n\\\": 4, \\\"rank\\\": r}\\n    if n == 5:\\n        for r, c in cnt.items():\\n\\\n          \\            if c == 3 and any(rr != r and cc == 2 for rr, cc in cnt.items()):\\n\\\n          \\                return {\\\"type\\\": \\\"trio_pair\\\", \\\"n\\\": 5, \\\"rank\\\": r}\\n\\\n          \\n    trio_ranks = [r for r in keys if cnt[r] >= 3]\\n    for i in range(len(trio_ranks)):\\n\\\n          \\        for j in range(i + 2, len(trio_ranks) + 1):\\n            run =\\\n          \\ trio_ranks[i:j]\\n            if not _is_run(run, len(run)):\\n        \\\n          \\        continue\\n            t = len(run)\\n            rest = n - 3 *\\\n          \\ t\\n            if rest == 0:\\n                continue\\n            if\\\n          \\ rest == t:\\n                return {\\\"type\\\": \\\"airplane_single\\\", \\\"\\\n          n\\\": n, \\\"rank\\\": run[-1]}\\n            if rest == 2 * t:\\n            \\\n          \\    rest_cnt = Counter({r: cnt[r] for r in cnt if r not in run})\\n    \\\n          \\            if len(rest_cnt) == t and all(c == 2 for c in rest_cnt.values()):\\n\\\n          \\                    return {\\\"type\\\": \\\"airplane_pair\\\", \\\"n\\\": n, \\\"rank\\\"\\\n          : run[-1]}\\n\\n    if n == 6:\\n        for r, c in cnt.items():\\n       \\\n          \\     if c == 4:\\n                return {\\\"type\\\": \\\"four_two\\\", \\\"n\\\"\\\n          : 6, \\\"rank\\\": r}\\n    if n == 8:\\n        for r, c in cnt.items():\\n  \\\n          \\          if c == 4:\\n                rest_cnt = Counter({rr: cc for rr,\\\n          \\ cc in cnt.items() if rr != r})\\n                if len(rest_cnt) == 2\\\n          \\ and all(c2 == 2 for c2 in rest_cnt.values()):\\n                    return\\\n          \\ {\\\"type\\\": \\\"four_two_pair\\\", \\\"n\\\": 8, \\\"rank\\\": r}\\n    return None\\n\\\n          \\n\\ndef combo_name(cl):\\n    return {\\n        \\\"single\\\": \\\"\u5355\u5f20\\\",\\n   \\\n          \\     \\\"pair\\\": \\\"\u5bf9\u5b50\\\",\\n        \\\"trio\\\": \\\"\u4e09\u5f20\\\",\\n        \\\"trio_single\\\"\\\n          : \\\"\u4e09\u5e26\u4e00\\\",\\n        \\\"trio_pair\\\": \\\"\u4e09\u5e26\u4e8c\\\",\\n        \\\"straight\\\": \\\"\u987a\u5b50\\\"\\\n          ,\\n        \\\"double_straight\\\": \\\"\u8fde\u5bf9\\\",\\n        \\\"airplane\\\": \\\"\u98de\u673a\\\",\\n\\\n          \\        \\\"airplane_single\\\": \\\"\u98de\u673a\u5e26\u5355\\\",\\n        \\\"airplane_pair\\\": \\\"\u98de\u673a\u5e26\u5bf9\\\"\\\n          ,\\n        \\\"four_two\\\": \\\"\u56db\u5e26\u4e8c\\\",\\n        \\\"four_two_pair\\\": \\\"\u56db\u5e26\u4e24\u5bf9\\\",\\n\\\n          \\        \\\"bomb\\\": \\\"\u70b8\u5f39\\\",\\n        \\\"rocket\\\": \\\"\u738b\u70b8\\\",\\n    }.get(cl[\\\"\\\n          type\\\"], cl[\\\"type\\\"]) if cl else \\\"\\\"\\n\\n\\ndef beats(a, b):\\n    \\\"\\\"\\\"\\\n          a \u80fd\u5426\u7ba1\u4e0a b\u3002\\\"\\\"\\\"\\n    if a is None or b is None:\\n        return False\\n\\\n          \\    if a[\\\"type\\\"] == \\\"rocket\\\":\\n        return b[\\\"type\\\"] != \\\"rocket\\\"\\\n          \\n    if b[\\\"type\\\"] == \\\"rocket\\\":\\n        return False\\n    if a[\\\"type\\\"\\\n          ] == \\\"bomb\\\" and b[\\\"type\\\"] != \\\"bomb\\\":\\n        return True\\n    if\\\n          \\ b[\\\"type\\\"] == \\\"bomb\\\" and a[\\\"type\\\"] != \\\"bomb\\\":\\n        return False\\n\\\n          \\    if a[\\\"type\\\"] != b[\\\"type\\\"] or a[\\\"n\\\"] != b[\\\"n\\\"]:\\n        return\\\n          \\ False\\n    return a[\\\"rank\\\"] > b[\\\"rank\\\"]\\n\\n\\n# ----------------------------------------------------------------\\\n          \\ \u8d70\u5b50\u751f\u6210\\n\\n\\ndef gen_moves(hand):\\n    \\\"\\\"\\\"\u679a\u4e3e\u624b\u724c\u6240\u6709\u5408\u6cd5\u724c\u578b\uff08\u53bb\u91cd\uff0c\u5df2\u6309\u724c\u9762\u6392\u5e8f\uff09\u3002\\\"\\\"\\\"\\\n          \\n    return [list(m) for m in _gen_moves_cached(tuple(sort_cards(hand)))]\\n\\\n          \\n\\n@lru_cache(maxsize=4096)\\ndef _gen_moves_cached(hand):\\n    found =\\\n          \\ set()\\n    cnt = Counter(VALUE[c] for c in hand)\\n    by_val = {}\\n  \\\n          \\  for c in sort_cards(hand):\\n        by_val.setdefault(VALUE[c], []).append(c)\\n\\\n          \\    vals = sorted(cnt)\\n\\n    def add(cards):\\n        cl = classify(cards)\\n\\\n          \\        if cl:\\n            found.add(tuple(sort_cards(cards)))\\n\\n   \\\n          \\ for v in vals:\\n        k = cnt[v]\\n        add(by_val[v][:1])\\n     \\\n          \\   if k >= 2:\\n            add(by_val[v][:2])\\n        if k >= 3:\\n   \\\n          \\         add(by_val[v][:3])\\n        if k == 4:\\n            add(by_val[v])\\n\\\n          \\    if 16 in cnt and 17 in cnt:\\n        add([by_val[16][0], by_val[17][0]])\\n\\\n          \\n    for v in vals:\\n        if cnt[v] < 3:\\n            continue\\n   \\\n          \\     trio = by_val[v][:3]\\n        for w in vals:\\n            if w ==\\\n          \\ v:\\n                continue\\n            add(trio + [by_val[w][0]])\\n\\\n          \\            if cnt[w] >= 2:\\n                add(trio + by_val[w][:2])\\n\\\n          \\n    for length in range(5, 13):\\n        for start in range(3, MAX_STRAIGHT_RANK\\\n          \\ - length + 2):\\n            ranks = list(range(start, start + length))\\n\\\n          \\            if all(cnt.get(r, 0) >= 1 for r in ranks):\\n              \\\n          \\  add([by_val[r][0] for r in ranks])\\n\\n    for length in range(3, 11):\\n\\\n          \\        for start in range(3, MAX_STRAIGHT_RANK - length + 2):\\n      \\\n          \\      ranks = list(range(start, start + length))\\n            if all(cnt.get(r,\\\n          \\ 0) >= 2 for r in ranks):\\n                add([c for r in ranks for c\\\n          \\ in by_val[r][:2]])\\n\\n    for length in range(2, 7):\\n        for start\\\n          \\ in range(3, MAX_STRAIGHT_RANK - length + 2):\\n            ranks = list(range(start,\\\n          \\ start + length))\\n            if not all(cnt.get(r, 0) >= 3 for r in ranks):\\n\\\n          \\                continue\\n            base = [c for r in ranks for c in\\\n          \\ by_val[r][:3]]\\n            add(base)\\n            rest = [c for c in\\\n          \\ hand if VALUE[c] not in ranks]\\n            if len(rest) >= length:\\n\\\n          \\                for comb in combinations(rest, length):\\n             \\\n          \\       add(base + list(comb))\\n            pair_ranks = sorted({VALUE[c]\\\n          \\ for c in rest if sum(1 for x in rest if VALUE[x] == VALUE[c]) >= 2})\\n\\\n          \\            if len(pair_ranks) >= length:\\n                for comb in\\\n          \\ combinations(pair_ranks, length):\\n                    add(base + [c for\\\n          \\ r in comb for c in by_val[r][:2]])\\n\\n    for v in vals:\\n        if cnt[v]\\\n          \\ != 4:\\n            continue\\n        quad = list(by_val[v])\\n        rest\\\n          \\ = [c for c in hand if VALUE[c] != v]\\n        if len(rest) >= 2:\\n   \\\n          \\         for comb in combinations(rest, 2):\\n                add(quad +\\\n          \\ list(comb))\\n        pair_ranks = sorted({VALUE[c] for c in rest if sum(1\\\n          \\ for x in rest if VALUE[x] == VALUE[c]) >= 2})\\n        if len(pair_ranks)\\\n          \\ >= 2:\\n            for comb in combinations(pair_ranks, 2):\\n        \\\n          \\        add(quad + [c for r in comb for c in by_val[r][:2]])\\n\\n    return\\\n          \\ tuple(sorted(found, key=lambda t: (len(t), tuple(VALUE[c] for c in t))))\\n\\\n          \\n\\n# ---------------------------------------------------------------- \u5bf9\u5c40\u72b6\u6001\\n\\\n          \\n\\ndef new_game(hands, steps=3, names=None, lead=0, title=\\\"\\\"):\\n    names\\\n          \\ = names or [\\\"\u4f60\\\", \\\"\u5de6\u5bb6\\\", \\\"\u53f3\u5bb6\\\"]\\n    seats = [{\\\"name\\\": names[i] if\\\n          \\ i < len(names) else \\\"\u73a9\u5bb6%d\\\" % i, \\\"hand\\\": sort_cards(h)}\\n         \\\n          \\    for i, h in enumerate(hands)]\\n    return {\\n        \\\"title\\\": title,\\n\\\n          \\        \\\"seats\\\": seats,\\n        \\\"turn\\\": lead,\\n        \\\"last\\\": None,\\n\\\n          \\        \\\"passes\\\": 0,\\n        \\\"steps\\\": steps,\\n        \\\"steps_left\\\"\\\n          : steps,\\n        \\\"status\\\": \\\"playing\\\",\\n        \\\"reason\\\": \\\"\\\",\\n\\\n          \\        \\\"history\\\": [],\\n    }\\n\\n\\ndef _copy(state):\\n    return {\\n\\\n          \\        \\\"title\\\": state.get(\\\"title\\\", \\\"\\\"),\\n        \\\"seats\\\": [{\\\"\\\n          name\\\": s[\\\"name\\\"], \\\"hand\\\": list(s[\\\"hand\\\"])} for s in state[\\\"seats\\\"\\\n          ]],\\n        \\\"turn\\\": state[\\\"turn\\\"],\\n        \\\"last\\\": None if not state[\\\"\\\n          last\\\"] else {\\\"seat\\\": state[\\\"last\\\"][\\\"seat\\\"], \\\"cards\\\": list(state[\\\"\\\n          last\\\"][\\\"cards\\\"])},\\n        \\\"passes\\\": state[\\\"passes\\\"],\\n        \\\"\\\n          steps\\\": state[\\\"steps\\\"],\\n        \\\"steps_left\\\": state[\\\"steps_left\\\"\\\n          ],\\n        \\\"status\\\": state[\\\"status\\\"],\\n        \\\"reason\\\": state.get(\\\"\\\n          reason\\\", \\\"\\\"),\\n        \\\"history\\\": [dict(h) for h in state.get(\\\"history\\\"\\\n          , [])],\\n    }\\n\\n\\ndef last_combo(state):\\n    if not state[\\\"last\\\"]:\\n\\\n          \\        return None\\n    return classify(state[\\\"last\\\"][\\\"cards\\\"])\\n\\n\\\n          \\ndef _tick(state, seat):\\n    if seat != 0:\\n        return state\\n   \\\n          \\ state[\\\"steps_left\\\"] = max(0, state[\\\"steps_left\\\"] - 1)\\n    if state[\\\"\\\n          status\\\"] == \\\"playing\\\" and state[\\\"steps_left\\\"] <= 0:\\n        state[\\\"\\\n          status\\\"] = \\\"lose\\\"\\n        state[\\\"reason\\\"] = \\\"\u6b65\u6570\u7528\u5c3d\uff0c\u724c\u6ca1\u51fa\u5b8c\\\"\\n    return\\\n          \\ state\\n\\n\\ndef apply_move(state, seat, cards):\\n    \\\"\\\"\\\"\u6267\u884c\u4e00\u6b65\uff1bcards=None\\\n          \\ \u8868\u793a\u8fc7\u3002\u8fd4\u56de\u65b0\u72b6\u6001\uff0c\u975e\u6cd5\u65f6\u629b IllegalMove\u3002\\\"\\\"\\\"\\n    if state[\\\"status\\\"] != \\\"playing\\\"\\\n          :\\n        raise IllegalMove(\\\"\u724c\u5c40\u5df2\u7ecf\u7ed3\u675f\\\")\\n    if seat != state[\\\"turn\\\"\\\n          ]:\\n        raise IllegalMove(\\\"\u8fd8\u6ca1\u8f6e\u5230\u4f60\\\")\\n    s = _copy(state)\\n    hand\\\n          \\ = s[\\\"seats\\\"][seat][\\\"hand\\\"]\\n\\n    if cards is None:\\n        if s[\\\"\\\n          last\\\"] is None or s[\\\"last\\\"][\\\"seat\\\"] == seat:\\n            raise IllegalMove(\\\"\\\n          \u4f60\u662f\u5148\u624b\uff0c\u5fc5\u987b\u51fa\u724c\\\")\\n        s[\\\"history\\\"].append({\\\"seat\\\": seat, \\\"cards\\\":\\\n          \\ None})\\n        s[\\\"passes\\\"] += 1\\n        if s[\\\"passes\\\"] >= len(s[\\\"\\\n          seats\\\"]) - 1:\\n            s[\\\"turn\\\"] = s[\\\"last\\\"][\\\"seat\\\"]\\n      \\\n          \\      s[\\\"last\\\"] = None\\n            s[\\\"passes\\\"] = 0\\n        else:\\n\\\n          \\            s[\\\"turn\\\"] = (seat + 1) % len(s[\\\"seats\\\"])\\n        return\\\n          \\ _tick(s, seat)\\n\\n    cards = sort_cards(cards)\\n    cl = classify(cards)\\n\\\n          \\    if cl is None:\\n        raise IllegalMove(\\\"\u8fd9\u4e0d\u662f\u5408\u6cd5\u724c\u578b\\\")\\n    pool =\\\n          \\ list(hand)\\n    for c in cards:\\n        if c not in pool:\\n         \\\n          \\   raise IllegalMove(\\\"\u624b\u91cc\u6ca1\u6709\u8fd9\u5f20\u724c\uff1a%s\\\" % DISPLAY[c])\\n        pool.remove(c)\\n\\\n          \\    if s[\\\"last\\\"] is not None and s[\\\"last\\\"][\\\"seat\\\"] != seat:\\n   \\\n          \\     if not beats(cl, last_combo(s)):\\n            raise IllegalMove(\\\"\\\n          \u7ba1\u4e0d\u4e0a\u4e0a\u5bb6\u7684%s\\\" % combo_name(last_combo(s)))\\n\\n    s[\\\"seats\\\"][seat][\\\"hand\\\"\\\n          ] = pool\\n    s[\\\"last\\\"] = {\\\"seat\\\": seat, \\\"cards\\\": cards}\\n    s[\\\"\\\n          passes\\\"] = 0\\n    s[\\\"history\\\"].append({\\\"seat\\\": seat, \\\"cards\\\": cards})\\n\\\n          \\    if not pool:\\n        s[\\\"status\\\"] = \\\"win\\\" if seat == 0 else \\\"\\\n          lose\\\"\\n        s[\\\"reason\\\"] = \\\"\u4f60\u51fa\u5b8c\u4e86\\\" if seat == 0 else \\\"%s\u51fa\u5b8c\u4e86\\\" % s[\\\"\\\n          seats\\\"][seat][\\\"name\\\"]\\n        return _tick(s, seat)\\n    s[\\\"turn\\\"\\\n          ] = (seat + 1) % len(s[\\\"seats\\\"])\\n    return _tick(s, seat)\\n\\n\\n# ----------------------------------------------------------------\\\n          \\ AI\\n\\n\\ndef _move_key(move):\\n    cl = classify(move)\\n    bombish = 1\\\n          \\ if cl and cl[\\\"type\\\"] in (\\\"bomb\\\", \\\"rocket\\\") else 0\\n    return (bombish,\\\n          \\ cl[\\\"rank\\\"] if cl else 0, -len(move), tuple(move))\\n\\n\\ndef ai_pick(state,\\\n          \\ seat):\\n    \\\"\\\"\\\"\u8fd4\u56de AI \u8981\u51fa\u7684\u724c\uff08list\uff09\u6216 None\uff08\u8fc7\uff09\u3002\u7b56\u7565\u786e\u5b9a\u3001\u65e0\u968f\u673a\u3002\\\"\\\"\\\"\\n    hand\\\n          \\ = state[\\\"seats\\\"][seat][\\\"hand\\\"]\\n    last = last_combo(state)\\n   \\\n          \\ last_seat = state[\\\"last\\\"][\\\"seat\\\"] if state[\\\"last\\\"] else None\\n \\\n          \\   moves = gen_moves(hand)\\n\\n    # \u961f\u53cb\u51fa\u7684\u724c\u4e0d\u538b\uff08\u9664\u975e\u80fd\u4e00\u628a\u8d70\u5b8c\uff09\\n    if last is not\\\n          \\ None and last_seat != 0:\\n        finishers = [m for m in moves if len(m)\\\n          \\ == len(hand) and beats(classify(m), last)]\\n        return finishers[0]\\\n          \\ if finishers else None\\n\\n    legal = [m for m in moves if last is None\\\n          \\ or beats(classify(m), last)]\\n    if not legal:\\n        return None\\n\\\n          \\n    player_left = len(state[\\\"seats\\\"][0][\\\"hand\\\"])\\n    if last is not\\\n          \\ None and player_left <= 2:\\n        # \u5bf9\u624b\u5feb\u8d70\u5b8c\u4e86\uff1a\u4f18\u5148\u7528\u6700\u5c0f\u7684\u975e\u70b8\u5f39\u7ba1\u4e0a\uff0c\u4f46\u5c3d\u91cf\u538b\u5927\\n     \\\n          \\   return min(legal, key=lambda m: (_move_key(m)[0], -_move_key(m)[1],\\\n          \\ len(m), tuple(m)))\\n    return min(legal, key=_move_key)\\n\\n\\ndef run_ai(state,\\\n          \\ guard=16):\\n    s = state\\n    steps = 0\\n    while s[\\\"status\\\"] == \\\"\\\n          playing\\\" and s[\\\"turn\\\"] != 0:\\n        seat = s[\\\"turn\\\"]\\n        s =\\\n          \\ apply_move(s, seat, ai_pick(s, seat))\\n        steps += 1\\n        if\\\n          \\ steps > guard:\\n            break\\n    return s\\n\\n\\ndef player_moves(state):\\n\\\n          \\    \\\"\\\"\\\"\u73a9\u5bb6\u5728\u5f53\u524d\u5c40\u9762\u4e0b\u7684\u5408\u6cd5\u8d70\u5b50\uff1b\u65e0\u724c\u53ef\u51fa\u65f6\u8fd4\u56de [None]\uff08\u8fc7\uff09\u3002\\\"\\\"\\\"\\n    hand = state[\\\"seats\\\"\\\n          ][0][\\\"hand\\\"]\\n    last = last_combo(state)\\n    moves = [m for m in gen_moves(hand)\\\n          \\ if last is None or beats(classify(m), last)]\\n    return moves or [None]\\n\\\n          \\n\\n# ---------------------------------------------------------------- \u6c42\u89e3\u5668\\n\\\n          \\n\\ndef solve(state, max_depth=6, max_nodes=200000):\\n    \\\"\\\"\\\"\u5728 AI \u786e\u5b9a\u6027\u7b56\u7565\u4e0b\uff0c\u6c42\u73a9\u5bb6\u5728\\\n          \\ max_depth \u6b65\u5185\u8d70\u5b8c\u7684\u7740\u6cd5\u5e8f\u5217\uff1b\u65e0\u89e3\u8fd4\u56de None\u3002\\\"\\\"\\\"\\n    memo = {}\\n    budget = {\\\"\\\n          nodes\\\": 0}\\n\\n    def key(s):\\n        return (\\n            tuple(tuple(x[\\\"\\\n          hand\\\"]) for x in s[\\\"seats\\\"]),\\n            s[\\\"turn\\\"],\\n           \\\n          \\ None if not s[\\\"last\\\"] else (s[\\\"last\\\"][\\\"seat\\\"], tuple(s[\\\"last\\\"\\\n          ][\\\"cards\\\"])),\\n            s[\\\"steps_left\\\"],\\n            s[\\\"status\\\"\\\n          ],\\n        )\\n\\n    def dfs(s):\\n        if s[\\\"status\\\"] == \\\"win\\\":\\n\\\n          \\            return []\\n        if s[\\\"status\\\"] != \\\"playing\\\" or s[\\\"\\\n          steps_left\\\"] <= 0:\\n            return None\\n        k = key(s)\\n     \\\n          \\   if k in memo:\\n            return memo[k]\\n        budget[\\\"nodes\\\"\\\n          ] += 1\\n        if budget[\\\"nodes\\\"] > max_nodes:\\n            return None\\n\\\n          \\n        hand = s[\\\"seats\\\"][0][\\\"hand\\\"]\\n        last = last_combo(s)\\n\\\n          \\        legal = [m for m in gen_moves(hand) if last is None or beats(classify(m),\\\n          \\ last)]\\n        # \u80fd\u4e00\u624b\u8d70\u5b8c\u5c31\u76f4\u63a5\u8d70\u5b8c \u2014\u2014 \u73a9\u5bb6\u51fa\u5b8c\u5373\u80dc\uff0cAI \u518d\u6ca1\u6709\u51fa\u724c\u673a\u4f1a\\n        for m in legal:\\n\\\n          \\            if len(m) == len(hand):\\n                memo[k] = [m]\\n  \\\n          \\              return memo[k]\\n        if s[\\\"steps_left\\\"] <= 1:\\n    \\\n          \\        memo[k] = None\\n            return None\\n\\n        memo[k] = None\\n\\\n          \\        # \u5927\u724c\u578b\u4f18\u5148\uff1a\u5148\u8bd5\u63a2\u300c\u4e00\u628a\u6e05\u6389\u66f4\u591a\u724c\u300d\u7684\u8d70\u6cd5\uff0c\u80fd\u663e\u8457\u51cf\u5c11\u641c\u7d22\\n        must_pass = not legal\\n\\\n          \\        legal = [m for m in legal if m]\\n        legal.sort(key=lambda\\\n          \\ m: (-len(m), -classify(m)[\\\"rank\\\"]))\\n        if must_pass:\\n       \\\n          \\     legal = [None]\\n        for m in legal:\\n            try:\\n      \\\n          \\          ns = run_ai(apply_move(s, 0, m))\\n            except IllegalMove:\\n\\\n          \\                continue\\n            if ns[\\\"status\\\"] == \\\"win\\\":\\n \\\n          \\               memo[k] = [m]\\n                return [m]\\n            if\\\n          \\ ns[\\\"status\\\"] != \\\"playing\\\":\\n                continue\\n           \\\n          \\ tail = dfs(ns)\\n            if tail is not None:\\n                memo[k]\\\n          \\ = [m] + tail\\n                return memo[k]\\n        return None\\n\\n\\\n          \\    return dfs(state)\\n\\n\\n# ----------------------------------------------------------------\\\n          \\ \u6e32\u67d3\\n\\n\\ndef render_table(state):\\n    s = state\\n    lines = []\\n    if\\\n          \\ s.get(\\\"title\\\"):\\n        lines.append(\\\"\u3010%s\u3011\\\" % s[\\\"title\\\"])\\n   \\\n          \\ lines.append(\\\"\u4f60\u7684\u624b\u724c\uff08%d \u5f20\uff09\uff1a%s\\\" % (len(s[\\\"seats\\\"][0][\\\"hand\\\"]), pretty(s[\\\"\\\n          seats\\\"][0][\\\"hand\\\"])))\\n    for i in range(1, len(s[\\\"seats\\\"])):\\n  \\\n          \\      seat = s[\\\"seats\\\"][i]\\n        lines.append(\\\"%s\uff1a\u5269 %d \u5f20\\\" % (seat[\\\"\\\n          name\\\"], len(seat[\\\"hand\\\"])))\\n    if s[\\\"last\\\"]:\\n        who = s[\\\"\\\n          seats\\\"][s[\\\"last\\\"][\\\"seat\\\"]][\\\"name\\\"]\\n        lines.append(\\\"\u4e0a\u5bb6\u51fa\u724c\uff1a%s\\\n          \\ \u51fa\u4e86 %s\uff08%s\uff09\\\" % (who, pretty(s[\\\"last\\\"][\\\"cards\\\"]), combo_name(classify(s[\\\"\\\n          last\\\"][\\\"cards\\\"]))))\\n    else:\\n        lines.append(\\\"\u8f6e\u5230\u4f60\u81ea\u7531\u51fa\u724c\\\")\\n \\\n          \\   lines.append(\\\"\u5269\u4f59\u6b65\u6570\uff1a%d\\\" % s[\\\"steps_left\\\"])\\n    return \\\"\\\\n\\\".join(lines)\\n\\\n          \\n\\ndef render_result(state):\\n    if state[\\\"status\\\"] == \\\"win\\\":\\n  \\\n          \\      return \\\"\u4f60\u8d62\u4e86\uff01%s\\\" % state[\\\"reason\\\"]\\n    if state[\\\"status\\\"] ==\\\n          \\ \\\"lose\\\":\\n        return \\\"\u4f60\u8f93\u4e86\uff1a%s\\\" % state[\\\"reason\\\"]\\n    return \\\"\\\n          \\\"\\n\\n\\n# ----------------------------------------------------------------\\\n          \\ \u56de\u5408\u5165\u53e3\\n\\n\\nPASS_WORDS = {\\\"\u8fc7\\\", \\\"\u4e0d\u8981\\\", \\\"\u8981\u4e0d\u8d77\\\", \\\"pass\\\", \\\"PASS\\\", \\\"\\\n          Pass\\\", \\\"\u4e0d\u51fa\\\", \\\"\u7ba1\u4e0d\u4e0a\\\"}\\n\\n\\ndef play_turn(state, text):\\n    \\\"\\\"\\\"\u5904\u7406\u73a9\u5bb6\u4e00\u53e5\u8bdd\uff0c\u8fd4\u56de\\\n          \\ {ok, message, state, status, steps_left}\u3002\\n\\n    state \u4e3a dict\uff08\u4e5f\u63a5\u53d7 JSON\\\n          \\ \u5b57\u7b26\u4e32\uff09\uff0c\u8fd4\u56de\u503c\u91cc\u7684 state \u662f dict\u3002\\n    \\\"\\\"\\\"\\n    s = json.loads(state) if isinstance(state,\\\n          \\ str) else _copy(state)\\n    text = (text or \\\"\\\").strip()\\n\\n    if s[\\\"\\\n          status\\\"] != \\\"playing\\\":\\n        return {\\\"ok\\\": False, \\\"message\\\": \\\"\\\n          \u672c\u5c40\u5df2\u7ed3\u675f\u3002\u53d1\u300c\u91cd\u5f00\u300d\u518d\u6253\u4e00\u5c40\u3002\\\", \\\"state\\\": s,\\n                \\\"status\\\": s[\\\"status\\\"\\\n          ], \\\"steps_left\\\": s[\\\"steps_left\\\"]}\\n\\n    # \u6307\u4ee4\\n    if text in (\\\"\u91cd\u5f00\\\"\\\n          , \\\"\u518d\u6765\u4e00\u5c40\\\", \\\"restart\\\"):\\n        return {\\\"ok\\\": False, \\\"message\\\": \\\"\\\n          \u6b8b\u5c40\u662f\u56fa\u5b9a\u7684\uff0c\u6362\u4e00\u5173\u8bf7\u5bf9\u6211\u8bf4\u300c\u4e0b\u4e00\u5173\u300d\u3002\\\", \\\"state\\\": s,\\n                \\\"status\\\": s[\\\"\\\n          status\\\"], \\\"steps_left\\\": s[\\\"steps_left\\\"]}\\n    if text in (\\\"\u63d0\u793a\\\", \\\"\\\n          hint\\\", \\\"\u5e2e\u6211\\\"):\\n        line = solve(s, max_depth=max(1, s[\\\"steps_left\\\"\\\n          ]))\\n        if not line:\\n            return {\\\"ok\\\": True, \\\"message\\\"\\\n          : \\\"\u8fd9\u4e00\u6b65\u5df2\u7ecf\u65e0\u89e3\u4e86\uff0c\u8bd5\u8bd5\u300c\u91cd\u5f00\u672c\u5173\u300d\u3002\\\", \\\"state\\\": s,\\n                    \\\"status\\\"\\\n          : s[\\\"status\\\"], \\\"steps_left\\\": s[\\\"steps_left\\\"]}\\n        first = line[0]\\n\\\n          \\        tip = \\\"\u8fc7\\\" if first is None else pretty(first)\\n        return\\\n          \\ {\\\"ok\\\": True, \\\"message\\\": \\\"\u63d0\u793a\uff1a\u5148\u51fa %s\uff08\u8fd9\u5c40\u5171 %d \u6b65\u53ef\u89e3\uff09\\\" % (tip, len(line)),\\\n          \\ \\\"state\\\": s,\\n                \\\"status\\\": s[\\\"status\\\"], \\\"steps_left\\\"\\\n          : s[\\\"steps_left\\\"]}\\n    if text in (\\\"\u8ba4\u8f93\\\", \\\"\u6295\u964d\\\", \\\"give up\\\"):\\n  \\\n          \\      s = _copy(s)\\n        s[\\\"status\\\"] = \\\"lose\\\"\\n        s[\\\"reason\\\"\\\n          ] = \\\"\u4f60\u8ba4\u8f93\u4e86\\\"\\n        return {\\\"ok\\\": True, \\\"message\\\": render_result(s),\\\n          \\ \\\"state\\\": s,\\n                \\\"status\\\": s[\\\"status\\\"], \\\"steps_left\\\"\\\n          : s[\\\"steps_left\\\"]}\\n\\n    # \u51fa\u724c \/ \u8fc7\\n    try:\\n        if text in PASS_WORDS:\\n\\\n          \\            ns = apply_move(s, 0, None)\\n        else:\\n            cards\\\n          \\ = parse_cards(text, s[\\\"seats\\\"][0][\\\"hand\\\"])\\n            ns = apply_move(s,\\\n          \\ 0, cards)\\n    except IllegalMove as e:\\n        return {\\\"ok\\\": False,\\\n          \\ \\\"message\\\": \\\"\u51fa\u4e0d\u4e86\uff1a%s\\\" % e, \\\"state\\\": s,\\n                \\\"status\\\"\\\n          : s[\\\"status\\\"], \\\"steps_left\\\": s[\\\"steps_left\\\"]}\\n\\n    ns = run_ai(ns)\\n\\\n          \\    msg = render_result(ns) if ns[\\\"status\\\"] != \\\"playing\\\" else render_table(ns)\\n\\\n          \\    return {\\\"ok\\\": True, \\\"message\\\": msg, \\\"state\\\": ns, \\\"status\\\":\\\n          \\ ns[\\\"status\\\"], \\\"steps_left\\\": ns[\\\"steps_left\\\"]}\\n\\n\\nPUZZLES = {'version':\\\n          \\ 1,\\n 'puzzles': [{'id': 'p01',\\n              'title': '\u7b2c 1 \u5173 \u00b7 \u987a\u5b50\u5f00\u8def',\\n\\\n          \\              'seats': 2,\\n              'steps': 2,\\n              'names':\\\n          \\ ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['3', '3', '5', '6', '7', '8', '9'],\\\n          \\ ['6', '9', 'K']]},\\n             {'id': 'p02',\\n              'title':\\\n          \\ '\u7b2c 2 \u5173 \u00b7 \u4e00\u6761\u9f99',\\n              'seats': 2,\\n              'steps': 2,\\n\\\n          \\              'names': ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['5', '5',\\\n          \\ '7', '8', '9', 'T', 'J'], ['4', '8', 'K', 'K', '2']]},\\n             {'id':\\\n          \\ 'p03',\\n              'title': '\u7b2c 3 \u5173 \u00b7 \u4e94\u5f20\u8fde\u73e0',\\n              'seats':\\\n          \\ 3,\\n              'steps': 2,\\n              'names': ['\u4f60', '\u5de6\u5bb6', '\u53f3\u5bb6'],\\n\\\n          \\              'hands': [['5', '6', '7', '8', '9', 'K', 'K'], ['6', '8',\\\n          \\ 'J', 'A', '2'], ['4', '8', 'Q']]},\\n             {'id': 'p04',\\n     \\\n          \\         'title': '\u7b2c 4 \u5173 \u00b7 \u987a\u5b50\u5f00\u8def',\\n              'seats': 3,\\n        \\\n          \\      'steps': 2,\\n              'names': ['\u4f60', '\u5de6\u5bb6', '\u53f3\u5bb6'],\\n        \\\n          \\      'hands': [['4', '5', '6', '7', '8', '9', 'K', 'K'], ['T', 'J', 'Q',\\\n          \\ 'A'], ['3', '4', 'Q']]},\\n             {'id': 'p05',\\n              'title':\\\n          \\ '\u7b2c 5 \u5173 \u00b7 \u4e00\u6761\u9f99',\\n              'seats': 2,\\n              'steps': 2,\\n\\\n          \\              'names': ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['3', '3',\\\n          \\ '9', 'T', 'J', 'Q', 'K', 'A'], ['3', 'T', 'J', 'Q', 'K']]},\\n        \\\n          \\     {'id': 'p06',\\n              'title': '\u7b2c 6 \u5173 \u00b7 \u4e94\u5f20\u8fde\u73e0',\\n          \\\n          \\    'seats': 2,\\n              'steps': 3,\\n              'names': ['\u4f60',\\\n          \\ '\u5de6\u5bb6'],\\n              'hands': [['7', '9', 'T', 'J', 'Q', 'K', '2'], ['4',\\\n          \\ '8', 'J']]},\\n             {'id': 'p07',\\n              'title': '\u7b2c 7\\\n          \\ \u5173 \u00b7 \u987a\u5b50\u5f00\u8def',\\n              'seats': 2,\\n              'steps': 3,\\n   \\\n          \\           'names': ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['4', '6', '7',\\\n          \\ '8', '9', 'T', 'A'], ['6', '9', 'Q']]},\\n             {'id': 'p08',\\n\\\n          \\              'title': '\u7b2c 8 \u5173 \u00b7 \u4e09\u8fde\u5bf9',\\n              'seats': 2,\\n    \\\n          \\          'steps': 2,\\n              'names': ['\u4f60', '\u5de6\u5bb6'],\\n          \\\n          \\    'hands': [['4', '4', 'J', 'J', 'Q', 'Q', 'K', 'K'], ['8', '8', 'A',\\\n          \\ '2']]},\\n             {'id': 'p09',\\n              'title': '\u7b2c 9 \u5173 \u00b7 \u8fde\u5bf9\u538b\u5236',\\n\\\n          \\              'seats': 2,\\n              'steps': 3,\\n              'names':\\\n          \\ ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['T', 'T', 'J', 'J', 'Q', 'Q', 'K',\\\n          \\ '2'], ['6', '8', '9', 'K', 'K']]},\\n             {'id': 'p10',\\n     \\\n          \\         'title': '\u7b2c 10 \u5173 \u00b7 \u4e09\u8fde\u5bf9',\\n              'seats': 3,\\n        \\\n          \\      'steps': 3,\\n              'names': ['\u4f60', '\u5de6\u5bb6', '\u53f3\u5bb6'],\\n        \\\n          \\      'hands': [['4', '7', '7', '8', '8', '9', '9', 'T'], ['6', '9'], ['6',\\\n          \\ 'T', 'Q']]},\\n             {'id': 'p11',\\n              'title': '\u7b2c 11\\\n          \\ \u5173 \u00b7 \u4e09\u5e26\u4e8c',\\n              'seats': 2,\\n              'steps': 2,\\n    \\\n          \\          'names': ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['3', '3', '8',\\\n          \\ '8', '8', 'J', 'J'], ['J', 'K', 'X']]},\\n             {'id': 'p12',\\n\\\n          \\              'title': '\u7b2c 12 \u5173 \u00b7 \u5e26\u5bf9\u538b\u4eba',\\n              'seats': 3,\\n  \\\n          \\            'steps': 2,\\n              'names': ['\u4f60', '\u5de6\u5bb6', '\u53f3\u5bb6'],\\n  \\\n          \\            'hands': [['4', '4', 'T', 'T', 'Q', 'Q', 'Q'], ['K', 'X'],\\\n          \\ ['4', '2']]},\\n             {'id': 'p13',\\n              'title': '\u7b2c 13\\\n          \\ \u5173 \u00b7 \u4e09\u5e26\u4e00',\\n              'seats': 2,\\n              'steps': 3,\\n    \\\n          \\          'names': ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['T', 'K', 'K',\\\n          \\ 'K', '2', '2'], ['7', '7', '9', 'x', 'X']]},\\n             {'id': 'p14',\\n\\\n          \\              'title': '\u7b2c 14 \u5173 \u00b7 \u56db\u4e2a\u7684\u813e\u6c14',\\n              'seats': 2,\\n \\\n          \\             'steps': 2,\\n              'names': ['\u4f60', '\u5de6\u5bb6'],\\n       \\\n          \\       'hands': [['4', '4', '4', '6', '2', '2', '2', '2'], ['T', 'J', 'J',\\\n          \\ 'J', 'J']]},\\n             {'id': 'p15',\\n              'title': '\u7b2c 15\\\n          \\ \u5173 \u00b7 \u4e00\u5bf9\u5b9a\u8f93\u8d62',\\n              'seats': 3,\\n              'steps': 3,\\n  \\\n          \\            'names': ['\u4f60', '\u5de6\u5bb6', '\u53f3\u5bb6'],\\n              'hands': [['4',\\\n          \\ '4', '9', '9', '2', '2'], ['5', 'J', 'J', 'K'], ['5', '6', '6', '7', 'X']]},\\n\\\n          \\             {'id': 'p16',\\n              'title': '\u7b2c 16 \u5173 \u00b7 \u6210\u53cc\u6210\u5bf9',\\n \\\n          \\             'seats': 2,\\n              'steps': 3,\\n              'names':\\\n          \\ ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['5', '5', 'J', 'J', '2', '2'],\\\n          \\ ['4', '8', 'K']]},\\n             {'id': 'p17',\\n              'title':\\\n          \\ '\u7b2c 17 \u5173 \u00b7 \u62c6\u5bf9\u5b50\u7684\u4eba',\\n              'seats': 2,\\n              'steps': 3,\\n\\\n          \\              'names': ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['5', '5',\\\n          \\ '9', '9', '2', '2'], ['4', 'J', 'A']]},\\n             {'id': 'p18',\\n\\\n          \\              'title': '\u7b2c 18 \u5173 \u00b7 \u624b\u91cc\u6709\u8d27',\\n              'seats': 2,\\n  \\\n          \\            'steps': 2,\\n              'names': ['\u4f60', '\u5de6\u5bb6'],\\n        \\\n          \\      'hands': [['6', '6', '6', 'x', 'X'], ['9', 'Q', 'Q', 'Q', '2']]},\\n\\\n          \\             {'id': 'p19',\\n              'title': '\u7b2c 19 \u5173 \u00b7 \u4e09\u5f20\u7684\u5e95\u6c14',\\n\\\n          \\              'seats': 2,\\n              'steps': 3,\\n              'names':\\\n          \\ ['\u4f60', '\u5de6\u5bb6'],\\n              'hands': [['3', '3', '3', '9', '9', '9', '9'],\\\n          \\ ['5', '7', 'x', 'X']]},\\n             {'id': 'p20',\\n              'title':\\\n          \\ '\u7b2c 20 \u5173 \u00b7 \u4e09\u8fde\u51fb',\\n              'seats': 3,\\n              'steps': 3,\\n\\\n          \\              'names': ['\u4f60', '\u5de6\u5bb6', '\u53f3\u5bb6'],\\n              'hands': [['5',\\\n          \\ '5', '5', 'T', 'T', 'T', 'T'], ['5', 'K', 'A'], ['J', '2', 'x', 'X']]}]}\\n\\\n          \\n\\n# ---------------------------------------------------------------- Dify\\\n          \\ \u8282\u70b9\u5165\u53e3\\n\\nLEVELS = PUZZLES[\\\"puzzles\\\"]\\n\\n\\ndef _start_level(level):\\n\\\n          \\    lv = int(level or 1)\\n    lv = max(1, min(lv, len(LEVELS)))\\n    p\\\n          \\ = LEVELS[lv - 1]\\n    st = new_game([list(h) for h in p[\\\"hands\\\"]], steps=p[\\\"\\\n          steps\\\"],\\n                  names=p[\\\"names\\\"], lead=0, title=p[\\\"title\\\"\\\n          ])\\n    return st, lv\\n\\n\\ndef main(state: str, move: str, level: int) ->\\\n          \\ dict:\\n    \\\"\\\"\\\"Dify \u4ee3\u7801\u8282\u70b9\u5165\u53e3\u3002\\n\\n    \u8f93\u5165\uff1a\\n        state  \u2014\u2014 \u4f1a\u8bdd\u53d8\u91cf\u91cc\u7684\u724c\u5c40 JSON\uff08\u9996\u6b21\u4e3a\u7a7a\u5b57\u7b26\u4e32\uff09\\n\\\n          \\        move   \u2014\u2014 \u73a9\u5bb6\u8fd9\u4e00\u53e5\u8f93\u5165\\n        level  \u2014\u2014 \u4f1a\u8bdd\u53d8\u91cf\u91cc\u7684\u5173\u5361\u53f7\uff08\u9996\u6b21\u4e3a 1\uff09\\n    \u8f93\u51fa\uff1a\\n\\\n          \\        ok \/ message \/ state \/ status \/ steps_left \/ level \/ title\\n  \\\n          \\  \\\"\\\"\\\"\\n    try:\\n        cur = json.loads(state) if state else None\\n\\\n          \\    except Exception:\\n        cur = None\\n    text = (move or \\\"\\\").strip()\\n\\\n          \\    lv = int(level or 1)\\n\\n    # \u7b2c\u4e00\u56de\u5408\uff1a\u5f00\u5c40\\n    if not cur:\\n        st,\\\n          \\ lv = _start_level(lv)\\n        return {\\\"ok\\\": True, \\\"message\\\": render_table(st),\\n\\\n          \\                \\\"state\\\": json.dumps(st, ensure_ascii=False),\\n      \\\n          \\          \\\"status\\\": \\\"playing\\\", \\\"steps_left\\\": st[\\\"steps_left\\\"],\\n\\\n          \\                \\\"level\\\": lv, \\\"title\\\": st.get(\\\"title\\\", \\\"\\\"),\\n  \\\n          \\              \\\"settled\\\": False, \\\"summary\\\": \\\"\\\"}\\n\\n    # \u6362\u