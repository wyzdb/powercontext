# 温故 · 一键起全栈（seekdb + 应用）
#
# 用法：
#   docker compose up --build
#   浏览器打开 http://localhost:8000
#
# 离线可跑：应用用内置 hash 向量兜底，不需要任何外部 API key。

name: wengu

services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: wengu-seekdb
    ports:
      - "2881:2881"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/2881' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wengu-app
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: ""
      SEEKDB_DATABASE: wengu
      EMBED_PROVIDER: hash
      EMBED_DIM: "1024"
    ports:
      - "8000:8000"
    depends_on:
      seekdb:
        condition: service_healthy
    restart: unless-stopped
