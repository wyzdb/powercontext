services:
  seekdb:
    # Pin the database version. If this tag is unavailable for your platform,
    # use oceanbase/seekdb:latest and record the actual version in the report.
    image: oceanbase/seekdb:1.4.0
    container_name: stepfun-seekdb
    ports:
      - "2881:2881"
    environment:
      MEMORY_LIMIT: 4G
      CPU_COUNT: 4
    volumes:
      - seekdb-data:/var/lib/seekdb
    restart: unless-stopped

volumes:
  seekdb-data:
