<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qoder 设置 · UID</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 40px;
  }
  .settings-card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 500px;
    margin: 0 auto;
    overflow: hidden;
  }
  .header {
    background: #2f5d54;
    color: #fff;
    padding: 20px 24px;
    font-size: 18px;
    font-weight: 600;
  }
  .section {
    padding: 20px 24px;
    border-bottom: 1px solid #eee;
  }
  .section:last-child {
    border-bottom: none;
  }
  .label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .value {
    font-size: 16px;
    color: #333;
    font-family: "Consolas", monospace;
    background: #f8f8f8;
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid #e0e0e0;
  }
  .uid-highlight {
    background: #e8f5e9;
    border-color: #4caf50;
    color: #2e7d32;
    font-weight: 600;
  }
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #2f5d54;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    margin-right: 16px;
  }
  .user-row {
    display: flex;
    align-items: center;
  }
  .user-info {
    flex: 1;
  }
  .user-name {
    font-size: 16px;
    font-weight: 600;
    color: #333;
  }
  .user-email {
    font-size: 13px;
    color: #888;
    margin-top: 2px;
  }
  .note {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 13px;
    color: #856404;
    margin: 16px 24px;
  }
</style>
</head>
<body>
<div class="settings-card">
  <div class="header">️ Qoder 设置</div>
  
  <div class="section">
    <div class="label">账号</div>
    <div class="user-row">
      <div class="avatar">W</div>
      <div class="user-info">
        <div class="user-name">wzydb</div>
        <div class="user-email">user@example.com</div>
      </div>
    </div>
  </div>
  
  <div class="section">
    <div class="label">Qoder UID</div>
    <div class="value uid-highlight">01a17d21-6536-76a4-869d-347e91522d63</div>
  </div>
  
  <div class="section">
    <div class="label">版本</div>
    <div class="value">Qoder Desktop 1.4.1</div>
  </div>
</div>

<div class="note">
  <strong>提示：</strong>请替换为你的真实 Qoder UID。打开 Qoder Desktop → 设置 → 账号，复制 UID 替换上方的占位符。
</div>
</body>
</html>
