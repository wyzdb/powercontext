# 温故 · seekdb 单服务编排
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml down        # 停服务，数据卷保留
#
# 注意：如果本机已经有一个手工 docker run 起来的 seekdb 容器（容器名 seekdb），
# 先 docker stop seekdb 再起这个 compose —— 2881/2886 端口只能有一个监听者。
#
# 镜像参数来自 seekdb 官方 README：端口 2881(MySQL 协议)/2886，容器内数据目录 /var/lib/oceanbase。

name: wengu-seekdb

services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: wengu-seekdb
    ports:
      - "2881:2881"
      - "2886:2886"
    volumes:
      - ../data/seekdb:/var/lib/oceanbase
    restart: unless-stopped
    healthcheck:
      # 只做 TCP 探活：2881 能连上即视为就绪。
      # 若镜像内没有 bash，把这行换成 mysqladmin -h127.0.0.1 -P2881 -uroot ping
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/2881' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
